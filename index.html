<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myHome</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="brand">myHome</div>
  <nav>
    <ul class="nav-menu">
      <li class="nav-item">
        <button class="nav-link" aria-haspopup="true" aria-expanded="false">myFlipBooks</button>
        <ul class="dropdown-menu">
          <li><a href="#" data-key="art-books" data-url="https://gmshannon99.github.io/GilsArtBooks-Web/">My Art Books</a></li>
          <li><a href="#" data-key="bw-book" data-url="https://gmshannon99.github.io/MySelectMenu/">Old BW Book</a></li>
        </ul>
      </li>
      <li class="nav-item">
        <button class="nav-link" aria-haspopup="true" aria-expanded="false">Jes Sie</button>
        <ul class="dropdown-menu">
          <li><a href="#" data-key="jes-sie" data-url="https://gmshannon99.github.io/oneshot-flipbook/">Jes Sie Flip Art Book</a></li>
        </ul>
      </li>
      <li class="nav-item">
        <button class="nav-link" aria-haspopup="true" aria-expanded="false">Games</button>
        <ul class="dropdown-menu">
          <li><a href="#" data-key="sudoku" data-url="https://gmshannon99.github.io/sudoku-web/">Sudoku by Gil</a></li>
        </ul>
      </li>
    </ul>
  </nav>
</header>

<button id="close-btn" title="Close current item" aria-label="Close current item">&times;</button>

<main id="content-area">
  <div id="welcome-screen">
    <h1>Welcome to myHome</h1>
    <p>Pick something from the menu above to get started.</p>

    <div class="shortcuts">
      <button type="button" class="shortcut" data-key="art-books" data-url="https://gmshannon99.github.io/GilsArtBooks-Web/" title="Art Books Vol. 1">
        <svg class="shortcut-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M32 14C27 10 18 9 10 10V50C18 49 27 50 32 54C37 50 46 49 54 50V10C46 9 37 10 32 14Z" fill="#2563eb"/>
          <path d="M32 14V54" stroke="#1e3a8a" stroke-width="2"/>
        </svg>
        <span class="shortcut-label">Art Books Vol. 1</span>
      </button>

      <button type="button" class="shortcut" data-key="bw-book" data-url="https://gmshannon99.github.io/MySelectMenu/" title="Old BW Book">
        <svg class="shortcut-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M32 14C27 10 18 9 10 10V50C18 49 27 50 32 54C37 50 46 49 54 50V10C46 9 37 10 32 14Z" fill="#6b7280"/>
          <path d="M32 14V54" stroke="#374151" stroke-width="2"/>
        </svg>
        <span class="shortcut-label">Old BW Book</span>
      </button>
    </div>
  </div>
  <!-- Content iframes are created here on demand by script.js -->
</main>

<script src="script.js"></script>
</body>
</html>
